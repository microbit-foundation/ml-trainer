name: build

on:
  release:
    types: [created]
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: "11"
  # renovate: datasource=npm depName=@microbit-foundation/ml-trainer-microbit registryUrl=https://npm.pkg.github.com
  ML_THEME_VERSION: 0.4.2
  # renovate: datasource=npm depName=@microbit-foundation/website-deploy-aws registryUrl=https://npm.pkg.github.com
  DEPLOY_AWS_VERSION: "1.1"

jobs:
  stages:
    # Skip apps releases - handled by ios-build.yml and android-build.yml
    if: ${{ github.event_name != 'release' || !contains(github.event.release.tag_name, '-apps') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.stages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: stages
        run: |
          if git ls-remote --exit-code --heads origin beta > /dev/null; then
            export BETA_BRANCH_EXISTS=true
          fi
          node ./bin/print-web-stages.cjs >> "$GITHUB_OUTPUT"

  build:
    needs: stages
    name: build (${{ matrix.stage }})
    strategy:
      # Each stage deploys only if its own checks pass.
      fail-fast: false
      matrix: ${{ fromJSON(needs.stages.outputs.matrix) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      STAGE: ${{ matrix.stage }}
      AWS_DEFAULT_REGION: eu-west-1
      VITE_FOUNDATION_BUILD: ${{ github.repository_owner == 'microbit-foundation' }}
      OFFICIAL_REPO: ${{ github.repository == 'microbit-foundation/ml-trainer' }}
      # Not really secret but worth keeping out the repo to prevent unintended use
      VITE_SENTRY_DSN: ${{ secrets.PROTOTYPE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
      - run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org
      - uses: microbit-foundation/npm-package-versioner-action@v3
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install --no-save @microbit-foundation/ml-trainer-microbit@${{ env.ML_THEME_VERSION }} @microbit-foundation/website-deploy-aws@${{ env.DEPLOY_AWS_VERSION }}
        if: github.repository_owner == 'microbit-foundation'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run apply-brand
      - run: node ./bin/print-web-ci-env.cjs >> $GITHUB_ENV
      - run: npm run ci
        env:
          # Uploads source maps to Sentry. Review builds don't report to Sentry.
          SENTRY_AUTH_TOKEN: ${{ env.STAGE != 'REVIEW' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - name: Run Playwright tests
        if: env.STAGE == 'REVIEW' || env.STAGE == 'STAGING' || env.STAGE == 'BETA'
        timeout-minutes: 10
        uses: docker://mcr.microsoft.com/playwright:v1.63.0-noble
        with:
          args: npx playwright test
      - name: Store reports
        if: (env.STAGE == 'REVIEW' || env.STAGE == 'STAGING' || env.STAGE == 'BETA') && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: github.repository_owner == 'microbit-foundation' && (env.STAGE == 'REVIEW' || (env.OFFICIAL_REPO == 'true' && success()))
        with:
          # Defined in microbit-foundation/microbit-org (apps/createai/infra).
          role-to-assume: arn:aws:iam::700731169244:role/github-actions-deploy-createai-content
          aws-region: eu-west-1
      - run: npm run deploy
        if: github.repository_owner == 'microbit-foundation' && (env.STAGE == 'REVIEW' || (env.OFFICIAL_REPO == 'true' && success()))
        env:
          # Set to 1 for one deploy after changing params in deployment.js,
          # as unchanged files are otherwise skipped.
          WEBSITE_DEPLOY_FORCE: 1
      - run: npm run invalidate
        if: github.repository_owner == 'microbit-foundation' && (env.STAGE == 'REVIEW' || (env.OFFICIAL_REPO == 'true' && success()))
